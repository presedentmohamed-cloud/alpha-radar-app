name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Minimal Android Project structure
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/ || true

      - name: Build APK via Simple Gradle
        run: |
          cd android
          echo "include ':app'" > settings.gradle
          mkdir -p app
          echo "apply plugin: 'com.android.application'" > app/build.gradle
          echo "android { compileSdk 33; defaultConfig { applicationId 'com.alpharadar.app'; minSdk 21; targetSdk 33; versionCode 1; versionName '1.0' } }" >> app/build.gradle
          
          # إنشاء ملف Gradle wrapper بسيط
          gradle wrapper
          chmod +x gradlew || true
          ./gradlew assembleDebug || echo "Fallback build"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
