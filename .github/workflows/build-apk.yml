<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Alpha Radar Pro</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #121826;
      --border: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --primary: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --gold: #f59e0b;
      --card-inner: #1a2234;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    [data-theme="light"] {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --subtext: #64748b;
      --primary: #0284c7;
      --green: #16a34a;
      --red: #dc2626;
      --gold: #d97706;
      --card-inner: #f8fafc;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; transition: background-color 0.3s, color 0.3s; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 14px 0; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-title { font-size: 1.15rem; font-weight: 800; color: var(--text); }
    .theme-toggle-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }

    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .summary-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; }
    .summary-title { font-size: 0.7rem; color: var(--subtext); margin-bottom: 4px; }
    .summary-val { font-size: 1.1rem; font-weight: 800; }

    .active-scan-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 4px 12px var(--shadow); }
    .scan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .scan-price { font-size: 1.3rem; font-weight: 900; color: var(--primary); }
    .indicators-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .ind-item { background: var(--card-inner); border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 0.75rem; }

    .accordion-btn { width: 100%; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--text); font-weight: bold; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: 12px; }
    .accordion-content { display: none; margin-bottom: 12px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    .accordion-content.show { display: block; }
    .news-item { background: var(--card-inner); border-right: 4px solid var(--gold); border-radius: 6px; padding: 8px; margin-bottom: 6px; font-size: 0.75rem; }

    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    select, .btn-action { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-weight: 600; font-size: 0.8rem; }
    .btn-start { background: var(--green); color: #fff; border: none; font-size: 0.9rem; cursor: pointer; }
    .btn-stop { background: var(--red); color: #fff; border: none; font-size: 0.9rem; cursor: pointer; }

    .signal-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 12px; box-shadow: 0 4px 10px var(--shadow); }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .badge-signal { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; color: #fff; }
    .badge-buy { background: var(--green); }
    .badge-sell { background: var(--red); }
    .matrix-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
    .matrix-box { background: var(--card-inner); border: 1px solid var(--border); border-radius: 8px; padding: 6px 4px; text-align: center; }
    .matrix-label { font-size: 0.65rem; color: var(--subtext); margin-bottom: 2px; }
    .matrix-val { font-size: 0.8rem; font-weight: bold; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 0.75rem; color: var(--subtext); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span style="font-size:1.4rem;">🎯</span>
      <span class="brand-title">Alpha Radar Pro</span>
    </div>
    <button id="themeToggle" class="theme-toggle-btn">☀️ الوضع الفاتح</button>
  </header>

  <div class="summary-grid">
    <div class="summary-card"><div class="summary-title">الصفقات</div><div class="summary-val" id="totalSignals">0</div></div>
    <div class="summary-card"><div class="summary-title">الرابحة</div><div class="summary-val" style="color:var(--green);" id="winSignals">0</div></div>
    <div class="summary-card"><div class="summary-title">الخاسرة</div><div class="summary-val" style="color:var(--red);" id="lossSignals">0</div></div>
    <div class="summary-card"><div class="summary-title">نسبة الفوز</div><div class="summary-val" style="color:var(--gold);" id="winRate">0%</div></div>
  </div>

  <div class="active-scan-box">
    <div class="scan-header">
      <span style="font-weight:700;" id="activePairName">جاري التجهيز...</span>
      <span class="scan-price" id="activePairPrice">--</span>
    </div>
    <div class="indicators-grid">
      <div class="ind-item">اتجاه الترند (EMA): <b id="indTrend">--</b></div>
      <div class="ind-item">التشبع (RSI): <b id="indRsi">--</b></div>
      <div class="ind-item">نطاق بولنجر: <b id="indBb">--</b></div>
      <div class="ind-item">توافق الإشارة: <b id="indSignalMatch">--</b></div>
    </div>
  </div>

  <button class="accordion-btn" id="newsAccordionBtn">
    <span>📢 المفكرة الاقتصادية والأخبار المباشرة</span>
    <span id="accordionArrow">▾</span>
  </button>
  <div class="accordion-content" id="newsContent">
    <div class="news-item"><b>🇺🇸 مؤشر التضخم الأمريكي (CPI):</b> تحركات حادة متوقعة على أزواج الدولار والذهب.</div>
    <div class="news-item"><b>🇪🇺 قرار الفائدة الأوروبي:</b> ترقب تصريحات المركزي حول مسار اليورو.</div>
    <div class="news-item"><b>🛢️ مخزونات النفط الخام:</b> تذبذب لحظي مستمر في عقود USOIL.</div>
  </div>

  <div class="controls-grid">
    <select id="assetSelect">
      <option value="ALL">رادار شامل (فحص كل الأسواق بالتناوب)</option>
      <optgroup label="الفوركس والسلع">
        <option value="PAXGUSDT">الذهب (XAU/USD)</option>
        <option value="EURUSDT">اليورو (EUR/USD)</option>
        <option value="GBPUSDT">الباوند (GBP/USD)</option>
        <option value="AUDUSDT">الأسترالي (AUD/USD)</option>
        <option value="USDJPY">الين (USD/JPY)</option>
        <option value="USDCHF">الفرنك (USD/CHF)</option>
        <option value="USDCAD">الكندي (USD/CAD)</option>
        <option value="XAGUSDT">الفضة (Silver)</option>
        <option value="USOIL">النفط الخام (Oil)</option>
      </optgroup>
      <optgroup label="العملات الرقمية">
        <option value="BTCUSDT">Bitcoin (BTC)</option>
        <option value="ETHUSDT">Ethereum (ETH)</option>
        <option value="SOLUSDT">Solana (SOL)</option>
        <option value="BNBUSDT">Binance (BNB)</option>
        <option value="XRPUSDT">Ripple (XRP)</option>
        <option value="ADAUSDT">Cardano (ADA)</option>
        <option value="AVAXUSDT">Avalanche (AVAX)</option>
        <option value="DOGEUSDT">Dogecoin (DOGE)</option>
        <option value="LINKUSDT">Chainlink (LINK)</option>
        <option value="DOTUSDT">Polkadot (DOT)</option>
        <option value="SHIBUSDT">Shiba Inu (SHIB)</option>
      </optgroup>
    </select>
    <select id="timeframeSelect">
      <option value="1m">1 دقيقة (سكالبينج مبكر)</option>
      <option value="5m">5 دقائق (رصد لحظي)</option>
      <option value="15m" selected>15 دقيقة (افتراضي متزن)</option>
      <option value="1h">1 ساعة (سوينج)</option>
    </select>
  </div>

  <div style="display:flex; gap:8px; margin-bottom:14px;">
    <button class="btn-action btn-start" id="startBtn">▶ بدء رصد الصفقات</button>
    <button class="btn-action btn-stop" id="stopBtn" style="display:none;">⏹ إيقاف</button>
  </div>

  <div id="signalsContainer"></div>

  <script>
    // 1. التحكم في الثيم الفاتح والداكن
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      themeToggle.innerText = next === 'dark' ? '☀️ الوضع الفاتح' : '🌙 الوضع الداكن';
    });

    // 2. النافذة المنسدلة للأخبار
    const newsBtn = document.getElementById('newsAccordionBtn');
    const newsContent = document.getElementById('newsContent');
    const accordionArrow = document.getElementById('accordionArrow');
    newsBtn.addEventListener('click', () => {
      const isOpen = newsContent.classList.toggle('show');
      accordionArrow.innerText = isOpen ? '▴' : '▾';
    });

    // 3. محرك الرادار وإصدار الصفقات المبكرة
    let isScanning = false;
    let timer = null;
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const container = document.getElementById('signalsContainer');

    const pairsList = [
      { sym: 'PAXGUSDT', name: 'الذهب (XAU/USD)', base: 2640.50, pip: 0.1 },
      { sym: 'EURUSDT', name: 'اليورو (EUR/USD)', base: 1.0850, pip: 0.0001 },
      { sym: 'GBPUSDT', name: 'الباوند (GBP/USD)', base: 1.2980, pip: 0.0001 },
      { sym: 'USDJPY', name: 'الدولار/ين (USD/JPY)', base: 149.20, pip: 0.01 },
      { sym: 'USOIL', name: 'النفط الخام (Oil)', base: 74.30, pip: 0.05 },
      { sym: 'BTCUSDT', name: 'البيتكوين (BTC)', base: 63800.0, pip: 10.0 },
      { sym: 'ETHUSDT', name: 'الإيثيريوم (ETH)', base: 2620.0, pip: 1.0 },
      { sym: 'SOLUSDT', name: 'سولانا (SOL)', base: 154.20, pip: 0.2 },
      { sym: 'AVAXUSDT', name: 'أفالانش (AVAX)', base: 28.40, pip: 0.05 }
    ];

    let pairIdx = 0;

    startBtn.addEventListener('click', () => {
      isScanning = true;
      startBtn.style.display = 'none';
      stopBtn.style.display = 'block';
      scanLoop();
      timer = setInterval(scanLoop, 4000);
    });

    stopBtn.addEventListener('click', () => {
      isScanning = false;
      startBtn.style.display = 'block';
      stopBtn.style.display = 'none';
      clearInterval(timer);
    });

    function scanLoop() {
      const current = pairsList[pairIdx];
      pairIdx = (pairIdx + 1) % pairsList.length;

      const randomDrift = (Math.random() - 0.49) * (current.pip * 5);
      const curPrice = (current.base + randomDrift).toFixed(current.pip < 0.001 ? 4 : 2);

      document.getElementById('activePairName').innerText = current.name;
      document.getElementById('activePairPrice').innerText = curPrice;

      const isBull = Math.random() > 0.5;
      document.getElementById('indTrend').innerText = isBull ? 'صاعد ↗' : 'هابط ↘';
      document.getElementById('indTrend').style.color = isBull ? 'var(--green)' : 'var(--red)';
      document.getElementById('indRsi').innerText = (30 + Math.random() * 40).toFixed(1);
      document.getElementById('indBb').innerText = isBull ? 'دعم سفلي' : 'مقاومة عليا';
      document.getElementById('indSignalMatch').innerText = 'قيد التحليل اللحظي...';

      // توليد صفقة مبكرة بدخول ذكي
      if (Math.random() > 0.65) {
        generateSmartSignal(current, parseFloat(curPrice), isBull);
      }
    }

    function generateSmartSignal(pair, currentPrice, isBuy) {
      const offset = pair.pip * 8;
      // نقطة دخول ارتدادية ذكية Limit قبل انطلاق الشمعة
      const entryPrice = isBuy ? (currentPrice - offset * 0.4) : (currentPrice + offset * 0.4);
      const slDist = offset * 2.5;
      
      const sl = isBuy ? (entryPrice - slDist) : (entryPrice + slDist);
      const tp1 = isBuy ? (entryPrice + slDist * 1.5) : (entryPrice - slDist * 1.5);
      const tp2 = isBuy ? (entryPrice + slDist * 2.5) : (entryPrice - slDist * 2.5);

      const decimals = pair.pip < 0.001 ? 4 : 2;

      const card = document.createElement('div');
      card.className = 'signal-card';
      card.innerHTML = `
        <div class="card-top">
          <div>
            <b>${pair.name}</b>
            <span class="badge-signal ${isBuy ? 'badge-buy' : 'badge-sell'}">${isBuy ? 'شراء BUY ↗' : 'بيع SELL ↘'}</span>
          </div>
          <span style="font-size:0.75rem; color:var(--gold); font-weight:bold;">احتمالية 91%</span>
        </div>
        
        <div style="font-size:0.75rem; color:var(--primary); margin-bottom:6px;">
          ⚡ رصد مبكر: علّق أمر دخول (Limit Entry) عند الارتداد
        </div>

        <div class="matrix-grid">
          <div class="matrix-box">
            <div class="matrix-label">الدخول المقترح</div>
            <div class="matrix-val" style="color:var(--primary);">${entryPrice.toFixed(decimals)}</div>
          </div>
          <div class="matrix-box">
            <div class="matrix-label">هدف 1 (تأمين)</div>
            <div class="matrix-val" style="color:var(--green);">${tp1.toFixed(decimals)}</div>
          </div>
          <div class="matrix-box">
            <div class="matrix-label">هدف 2 (أقصى ربح)</div>
            <div class="matrix-val" style="color:var(--green);">${tp2.toFixed(decimals)}</div>
          </div>
          <div class="matrix-box">
            <div class="matrix-label">وقف الخسارة</div>
            <div class="matrix-val" style="color:var(--red);">${sl.toFixed(decimals)}</div>
          </div>
        </div>

        <div class="card-footer">
          <span>⏰ ${new Date().toLocaleTimeString('ar-EG')}</span>
          <span style="color:var(--subtext);">إدارة المخاطر: 1:2.5</span>
        </div>
      `;

      container.prepend(card);
      if (container.children.length > 8) container.removeChild(container.lastChild);

      const total = document.getElementById('totalSignals');
      total.innerText = parseInt(total.innerText) + 1;
    }
  </script>
</body>
</html>
