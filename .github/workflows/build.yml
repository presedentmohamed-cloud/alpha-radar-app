name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Initialize Capacitor Project
        run: |
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/local-notifications@^6.0.0
          npx cap init "Alpha Radar Pro" "com.alpharadar.pro" --web-dir www
          npx cap add android

      - name: 5. Configure Permissions & Android Settings
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          if ! grep -q "android.permission.VIBRATE" "$MANIFEST"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.VIBRATE" />' "$MANIFEST"
          fi
          if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
          fi
          if ! grep -q "android.permission.FOREGROUND_SERVICE" "$MANIFEST"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' "$MANIFEST"
          fi
          if ! grep -q "android.permission.WAKE_LOCK" "$MANIFEST"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"
          fi
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST"
          npx cap sync android

      - name: 5.5. Apply Custom App Icon
        run: |
          RES_DIR="android/app/src/main/res"
          if [ -f "www/icon.png" ]; then
            for d in "$RES_DIR"/mipmap-*; do
              if [ -d "$d" ]; then
                cp www/icon.png "$d/ic_launcher.png"
                cp www/icon.png "$d/ic_launcher_round.png"
                cp www/icon.png "$d/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: 6. Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 7. Upload Built APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaRadar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
